[build]
  publish = "."
  functions = "netlify/functions"
  # garante o npm install (sem isso o @netlify/blobs não entra no bundle)
  command = "npm ci"

[functions]
  node_bundler = "esbuild"

# /api/* -> functions (sem isso o front chama /api/checkout e toma 404 em produção)
[[redirects]]
  from = "/api/checkout"
  to = "/.netlify/functions/checkout"
  status = 200

[[redirects]]
  from = "/api/status"
  to = "/.netlify/functions/status"
  status = 200

[[redirects]]
  from = "/api/webhook"
  to = "/.netlify/functions/webhook"
  status = 200

[[redirects]]
  from = "/api/track"
  to = "/.netlify/functions/track"
  status = 200

[[redirects]]
  from = "/api/admin/*"
  to = "/.netlify/functions/admin/:splat"
  status = 200

# URL bonita do painel
[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200

# Não servir o código de backend como arquivo estático.
# force = true faz a regra vencer mesmo quando o arquivo existe no publish dir.
[[redirects]]
  from = "/netlify/*"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/server.js"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/package.json"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/test/*"
  to = "/index.html"
  status = 404
  force = true
